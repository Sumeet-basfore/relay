# cargo-deny configuration for Relay

[advisories]
yanked = "deny"
ignore = [
    # Transitive dev-dependency of testcontainers (test-only, non-production)
    "RUSTSEC-2025-0111",
    # Transitive dev-dependency of bollard/testcontainers (test-only, non-production)
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
