[package]
name = "relay-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface and gateway entrypoint for Relay"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
relay-domain = { workspace = true }
relay-canonical = { workspace = true }
relay-policy = { workspace = true }
relay-credentials = { workspace = true }
relay-receipts = { workspace = true }
relay-connectors = { workspace = true }
relay-mcp = { workspace = true }
relay-ledger = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }

clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "sync", "signal", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
color-eyre = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
relay-mcp = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true }
